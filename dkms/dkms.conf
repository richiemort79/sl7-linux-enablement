# Surface Laptop 7 (Intel) patched modules, rebuilt by DKMS for every new
# kernel. fetch-sources.sh lays out Ubuntu's exact sources for that kernel
# (kernel.org vX.Y + Ubuntu's diff.gz, network needed) and applies our
# patches. Modules override the stock ones from /lib/modules/<kv>/updates.
PACKAGE_NAME="sl7-enablement"
PACKAGE_VERSION="1.0"
AUTOINSTALL="yes"
BUILD_EXCLUSIVE_KERNEL="-generic$"
PRE_BUILD="fetch-sources.sh ${kernelver}"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src modules"
# dkms 3.0.x runs CLEAN after PRE_BUILD, so it must not remove src/ (the
# pre-build script starts from an empty src/ itself).
CLEAN="true"
BUILT_MODULE_NAME[0]="surface_aggregator_registry"
BUILT_MODULE_LOCATION[0]="src/drivers/platform/surface/"
DEST_MODULE_LOCATION[0]="/updates"
BUILT_MODULE_NAME[1]="ov02c10"
BUILT_MODULE_LOCATION[1]="src/drivers/media/i2c/"
DEST_MODULE_LOCATION[1]="/updates"
BUILT_MODULE_NAME[2]="snd-soc-sdw-utils"
BUILT_MODULE_LOCATION[2]="src/sound/soc/sdw_utils/"
DEST_MODULE_LOCATION[2]="/updates"
BUILT_MODULE_NAME[3]="intel-ipu7-isys"
BUILT_MODULE_LOCATION[3]="src/drivers/staging/media/ipu7/"
DEST_MODULE_LOCATION[3]="/updates"
