# PipeWire's ALSA sink for this card opens PCM device 0 ("Jack Out",
# silent — nothing plugged into the headphone jack) rather than device 2
# ("Speaker", the actual internal speakers), even though it displays
# "Speaker" as the active port name. This override only fixes the plain
# ALSA "default" device — i.e. apps that go straight through ALSA
# (speaker-test, mpv --ao=alsa, etc). It does NOT fix apps that go
# through PipeWire (browsers, most GUI apps, GNOME Settings' sound test)
# — that remains an open issue, see README "Known issues not yet fixed".
pcm.!default {
	type plug
	slave.pcm "hw:0,2"
}
