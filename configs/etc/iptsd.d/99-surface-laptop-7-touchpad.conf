# Surface Laptop 7 contact calibration, for use with the alex-lentz iptsd fork
# (physical Sensel click + debounce + anti-teleport guard) plus the LiftGraceMs patch.
#
# Measured failure history on this pad, so nobody retries these:
#   24/20 (default): light-touch slides flicker into dozens of ghost tap-clicks
#   16/12: noise detected as contacts (20-45 mm position teleports)
#   20/14: sticky contacts (2-3 s release lag, taps rejected)
#   20/18: contact fragmenting (8 taps become 54 touch sessions)
#   Neutral=average + NeutralValue=10 (SLS2 recipe): heavy position jitter, all taps rejected
#   PeakSuppressionRadius >= 2: do NOT enable, it suppresses the real second finger

[Contacts]
ActivationThreshold = 20
DeactivationThreshold = 16

[Touchpad]
ButtonDebounceMs = 30
# Grace period (local fork patch): a contact gone for less than this many ms is not
# reported as lifted. Bridges the sensor's detection dropouts, which are the source
# of ghost taps while sliding and ghost right clicks while two-finger scrolling.
# 70 ms still let rare ghosts through here; 110 ms was fully clean; 80 is my daily value.
LiftGraceMs = 80
